
name: Build Wii Companion

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: webhdx/devkitppc:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          apt-get update
          apt-get install -y unzip

      - name: Extract project
        run: |
          unzip -o WiiCompanion_v1.zip -d project
          find project -maxdepth 4 -type f

      - name: Diagnose Wii compiler
        run: |
          echo "PATH=$PATH"
          which powerpc-eabi-gcc || true
          which powerpc-eabi-ld || true
          powerpc-eabi-gcc --version || true
          powerpc-eabi-ld --version || true
          ls -l /opt/devkitpro/devkitPPC/bin/ || true
          
      - name: Compile Wii application
        run: |
          cd project
          WII_DIR="$(find . -type f -name Makefile -path '*/wii/Makefile' -print -quit | xargs dirname)"
          echo "Wii directory: $WII_DIR"
          cd "$WII_DIR"
          make

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: WiiCompanion-boot-dol
          path: project/**/wii/boot.dol
          if-no-files-found: error
