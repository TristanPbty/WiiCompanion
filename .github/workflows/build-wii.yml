
name: Build Wii Companion

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o WiiCompanion_v1.zip -d project
          ls -la project

      - name: Compile Wii application
        working-directory: project/WiiCompanion_v1/wii
        run: |
          make

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: WiiCompanion-boot-dol
          path: project/WiiCompanion_v1/wii/boot.dol
